[package]
name = "compvisor"
version = "1.0.0"
description = "Compvisor - Offline desktop time tracking & productivity monitor (rebuilt from Ever Gauzy with Rust, no Electron)"
authors = ["Compvisor"]
license = "AGPL-3.0"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# No HTTP/shell/native-tls features: app is 100% offline, dependency tree stays lean.
tauri = { version = "1.8", default-features = false, features = ["custom-protocol", "system-tray", "window-all", "macos-private-api"] }
# Embedded SQLite database - compiled INTO the binary (rusqlite bundled), zero setup required.
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
